name: Desktop Client

on:
  push:
    paths:
      - 'examples/desktop-client/**'
      - '.github/workflows/desktop_client.yml'
  pull_request:
    paths:
      - 'examples/desktop-client/**'
      - '.github/workflows/desktop_client.yml'

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 20
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, macos-14, windows-2022 ]
    defaults:
      run:
        working-directory: examples/desktop-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/desktop-client/package-lock.json

      # Also downloads the Nabto Client SDK library for the runner's platform.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Load the Nabto Client SDK
        run: node -e "console.log('Nabto Client SDK', require('./dist/main/nabto/client').NabtoClient.version())"

      - name: Package (unpacked)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --dir --publish never
